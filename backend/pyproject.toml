[project]
name = "satquery-backend"
version = "0.1.0"
description = "SatQuery AI Backend Core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "numpy>=1.26.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
